spring:
  application:
    name: demo
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
#      jdbc:
#        batch_size: 50
#        order_inserts: true
#        order_updates: true
      ddl-auto: none
    show-sql: true
    open-in-view: false

  liquibase:
    enabled: true
    change-log: classpath:liquibase/changelog-master.yml

  rabbitmq:
    host: localhost
    username: guest
    password: guest
    port: 5672
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 5
          max-interval: 5s
          multiplier: 1
        missing-queues-fatal: false



rabbitmq:
  queue:
    test: TEST_Q
    test-dlq: TEST_DLQ

  mail:
    host: smtp.gmail.com
    port: 587
    username: ilkinsuleymanov200@gmail.com
    password: ilkin2001 # Use App Password if 2FA is enabled
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
server:
  port: 8080

  spring:
    cloud:
      compatibility-verifier:
        enabled= true:

feign:
  client:
    config:
      default:
        connectTimeout: 5000  # Connection timeout (in ms)
        readTimeout: 5000     # Read timeout (in ms)

jwt:
  accessToken:
    expiration:
      time: 15
  refreshToken:
    expiration:
      time: 21600
      count: 50

